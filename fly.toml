# app 名由 `fly launch` 生成/确认
app = "parchment"
primary_region = "nrt"

[env]
  PORT = "8787"

[mounts]
  source = "parchment_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
