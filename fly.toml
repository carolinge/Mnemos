# 自部署模板：把 app 换成你自己 `fly apps create` 出来的名字。
# 作者本人的实例不再单独部署——Mnemos 已并进主站那个 app，挂在 /mnemos/ 下，
# 由 homepage/scripts/sync-mnemos-src.sh 同步源码后随主站一起构建。
app = "mnemos"
primary_region = "sin"

[env]
  PORT = "8787"

[mounts]
  source = "parchment_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # 笔记本已经并入 carolinge-homepage（/mnemos），常驻改到那边了。
  # 这台不再对外挂域名，改回闲置即停——app 和卷都留着当回滚，
  # 但没必要为一台没人访问的机器继续付常驻的钱。
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
