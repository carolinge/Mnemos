app = "carolinge-mnemos"
primary_region = "sin"

[env]
  PORT = "8787"

[mounts]
  source = "parchment_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # 笔记本已经并入 carolinge-homepage（/mnemos），常驻改到那边了。
  # 这台不再对外挂域名，改回闲置即停——app 和卷都留着当回滚，
  # 但没必要为一台没人访问的机器继续付常驻的钱。
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
