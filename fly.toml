app = "carolinge-mnemos"
primary_region = "sin"

[env]
  PORT = "8787"

[mounts]
  source = "parchment_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # 常驻一台：冷启动 7 秒对随手记笔记来说太久。512MB 常驻约 $3.4/月，
  # 加上两个数据卷 $0.6，仍在 $5 以内。主站那台继续闲置即停——
  # 两台都常驻就超预算了。
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
